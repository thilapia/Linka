[project]
name = "linka-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["linka-backend", "linka-counting-bot", "linkaFederations"]

[tool.uv]
package = false

[tool.uv.sources]
linka-backend = { workspace = true }
linka-counting-bot = { workspace = true }
linkaFederations = { workspace = true }

[tool.uv.workspace]
members = ["apps/backend", "packages/*"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/linka_lite", "docs", "sites", "**/examples", "**/main_teste.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

# Preserve formatting in relocated legacy modules; new modules use Ruff formatting.
[tool.ruff.format]
exclude = [
    "apps/backend/src/linka_backend/bluesky_federation/app.py",
    "apps/backend/src/linka_backend/bluesky_federation/bluesky_bridge.py",
    "apps/backend/src/linka_backend/bluesky_federation/create_post.py",
