[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linka_automoderator_bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["linkabot-sdk>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/linka_automoderator_bot"]

[project.scripts]
linka-automoderator = "linka_automoderator_bot.cli:main"
linka-automoderator-setup = "linka_automoderator_bot.cli:setup"

[tool.uv.sources]
linkabot-sdk = { workspace = true }
