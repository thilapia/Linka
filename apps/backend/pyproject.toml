[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linka-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "flask-cors>=5,<7", "werkzeug>=3.1,<4", "requests>=2.32,<3", "python-dotenv>=1,<2", "boto3>=1.35,<2", "botocore>=1.35,<2", "pillow>=11,<13", "beautifulsoup4>=4.12,<5", "cryptography>=44", "pyjwt>=2.9,<3", "platformdirs>=4,<5", "linka-automoderator-bot>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/linka_backend"]

[project.scripts]
linka-backend = "linka_backend.cli:main"

[tool.uv.sources]
linka-automoderator-bot = { workspace = true }
